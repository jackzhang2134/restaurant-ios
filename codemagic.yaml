workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: cd RestaurantManager && xcodegen generate
      - name: Build App
        script: |
          set -e
          cd RestaurantManager
          xcodebuild build \
            -project RestaurantManager.xcodeproj \
            -scheme RestaurantManager \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tail -50
          echo "=== Build complete ==="
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "RestaurantManager.app" -path "*Release-iphoneos*" | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
      - name: Package IPA
        script: |
          set -e
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "RestaurantManager.app" -path "*Release-iphoneos*" | head -1)
          echo "Using app: $APP_PATH"
          cd $CM_BUILD_DIR
          mkdir -p Payload
          rm -rf Payload/*
          cp -R "$APP_PATH" Payload/
          cd Payload
          zip -qr ../RestaurantManager.ipa .
          cd ..
          ls -lh RestaurantManager.ipa
    artifacts:
      - RestaurantManager.ipa