workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: cd RestaurantManager && xcodegen generate
      - name: Build Archive with Ad-Hoc Signing
        script: |
          set -e
          cd RestaurantManager
          xcodebuild archive \
            -project RestaurantManager.xcodeproj \
            -scheme RestaurantManager \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/RestaurantManager.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tail -30
      - name: Package IPA
        script: |
          set -e
          cd $CM_BUILD_DIR
          mkdir -p Payload
          rm -rf Payload/*
          cp -R RestaurantManager.xcarchive/Products/Applications/RestaurantManager.app Payload/
          cd Payload
          zip -qr ../RestaurantManager.ipa .
          cd ..
          ls -lh RestaurantManager.ipa
    artifacts:
      - RestaurantManager.ipa