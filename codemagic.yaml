workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: cd RestaurantManager && xcodegen generate
      - name: Build Archive
        script: |
          set -e
          cd RestaurantManager
          xcodebuild archive \
            -project RestaurantManager.xcodeproj \
            -scheme RestaurantManager \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/RestaurantManager.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tail -100
      - name: Verify Archive
        script: |
          ls -la $CM_BUILD_DIR/RestaurantManager.xcarchive/Products/Applications/
          echo "=== Archive contents ==="
          find $CM_BUILD_DIR/RestaurantManager.xcarchive -maxdepth 4 -type f
      - name: Package IPA
        script: |
          set -e
          cd $CM_BUILD_DIR
          mkdir -p Payload
          rm -rf Payload/*
          cp -R RestaurantManager.xcarchive/Products/Applications/RestaurantManager.app Payload/
          ls -la Payload/
          zip -qr RestaurantManager.ipa Payload/
          ls -lh RestaurantManager.ipa
    artifacts:
      - RestaurantManager.ipa