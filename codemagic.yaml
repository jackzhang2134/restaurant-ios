workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: cd RestaurantManager && xcodegen generate
      - name: Build Archive
        script: |
          set -e
          cd RestaurantManager
          xcodebuild archive \
            -project RestaurantManager.xcodeproj \
            -scheme RestaurantManager \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/RestaurantManager.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tail -30
      - name: Package and Ad-Hoc Sign
        script: |
          set -e
          cd $CM_BUILD_DIR
          mkdir -p Payload
          rm -rf Payload/*
          cp -R RestaurantManager.xcarchive/Products/Applications/RestaurantManager.app Payload/
          APP_PATH="Payload/RestaurantManager.app"
          echo "=== Signing binary with ad-hoc ==="
          codesign --force --sign - --timestamp=none "$APP_PATH"
          echo "=== Verifying signature ==="
          codesign -dv "$APP_PATH" 2>&1 | head -5
          echo "=== Packaging IPA ==="
          zip -qr RestaurantManager.ipa Payload
          ls -lh RestaurantManager.ipa
    artifacts:
      - RestaurantManager.ipa