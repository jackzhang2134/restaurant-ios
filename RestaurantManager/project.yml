name: RestaurantManager
options:
  bundleIdPrefix: com.restaurant
  deploymentTarget:
    iOS: "12.0"
  xcodeVersion: "14.0"
settings:
  base:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  RestaurantManager:
    type: application
    platform: iOS
    sources:
      - RestaurantManager
    settings:
      base:
        INFOPLIST_FILE: RestaurantManager/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.restaurant.host
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTED_PLATFORMS: iphoneos
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        SWIFT_VERSION: "5.0"